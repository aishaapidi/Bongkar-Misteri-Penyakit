&lt;h2 class=&quot;section-title&quot;&gt;Panduan Murid: Misi Detektif Simptom&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;Selamat datang, detektif! Kamu akan mencari petunjuk untuk mengenali simptom &lt;strong&gt;demam campak, rubella, cacar air dan beguk&lt;/strong&gt;. Baca panduan ini sebelum memulakan aktiviti.&lt;/p&gt;
&lt;div class=&quot;mission-target&quot;&gt;&lt;strong&gt;🎯 Misi kamu:&lt;/strong&gt; Kenal pasti sekurang-kurangnya dua simptom bagi setiap penyakit dan bezakan simptom yang hampir sama.&lt;/div&gt;
&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;btn hero-btn&quot; data-goto=&quot;galeri&quot; type=&quot;button&quot;&gt;🚀 Saya Bersedia! Mula Misi →&lt;/button&gt;&lt;span class=&quot;mini&quot;&gt;Dua bahagian aktiviti • Galeri + Roda • Padanan + Kuiz&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;div class=&quot;kicker&quot;&gt;Cara bermain&lt;/div&gt;
&lt;h3 class=&quot;section-title guide-subtitle&quot;&gt;Ikuti empat langkah mudah&lt;/h3&gt;
&lt;div class=&quot;student-steps&quot;&gt;
&lt;div class=&quot;student-step&quot;&gt;&lt;div class=&quot;step-emoji&quot;&gt;🩺&lt;/div&gt;&lt;div class=&quot;step-number&quot;&gt;LANGKAH 1&lt;/div&gt;&lt;h4&gt;Kenali penyakit&lt;/h4&gt;&lt;p&gt;Buka menu &lt;strong&gt;Galeri + Roda&lt;/strong&gt;. Tekan empat kad penyakit dan baca simptom yang terpapar.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;student-step&quot;&gt;&lt;div class=&quot;step-emoji&quot;&gt;🎡&lt;/div&gt;&lt;div class=&quot;step-number&quot;&gt;LANGKAH 2&lt;/div&gt;&lt;h4&gt;Putar roda&lt;/h4&gt;&lt;p&gt;Tekan &lt;strong&gt;Putar Roda&lt;/strong&gt;, baca petunjuk, bincang dengan rakan dan pilih jawapan yang paling sepadan.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;student-step&quot;&gt;&lt;div class=&quot;step-emoji&quot;&gt;🧩&lt;/div&gt;&lt;div class=&quot;step-number&quot;&gt;LANGKAH 3&lt;/div&gt;&lt;h4&gt;Padankan simptom&lt;/h4&gt;&lt;p&gt;Buka menu &lt;strong&gt;Padanan + Kuiz&lt;/strong&gt;. Pilih satu kad simptom, kemudian tekan nama penyakit yang sesuai.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;student-step&quot;&gt;&lt;div class=&quot;step-emoji&quot;&gt;🏆&lt;/div&gt;&lt;div class=&quot;step-number&quot;&gt;LANGKAH 4&lt;/div&gt;&lt;h4&gt;Selesaikan kes&lt;/h4&gt;&lt;p&gt;Baca &lt;strong&gt;empat situasi Klinik Detektif&lt;/strong&gt;. Pilih jawapan berdasarkan gabungan simptom dan semak markah.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;div class=&quot;twocol&quot;&gt;
&lt;div class=&quot;guide&quot;&gt;&lt;h3&gt;🤝 Peraturan detektif&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Dengar arahan dan tunggu giliran kumpulan.&lt;/li&gt;&lt;li&gt;Bincang sebelum memilih jawapan.&lt;/li&gt;&lt;li&gt;Baca semua petunjuk; jangan bergantung pada satu simptom sahaja.&lt;/li&gt;&lt;li&gt;Jika jawapan kurang tepat, cuba lagi dan belajar daripada maklum balas.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;guide&quot;&gt;&lt;h3&gt;💡 Petunjuk penting&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Demam campak:&lt;/strong&gt; demam tinggi, batuk, selesema, mata merah dan ruam.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Rubella:&lt;/strong&gt; ruam halus, demam ringan dan kadangkala kelenjar limfa bengkak.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Cacar air:&lt;/strong&gt; ruam gatal yang menjadi lepuh berair.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Beguk:&lt;/strong&gt; pipi atau rahang bengkak dan sakit semasa mengunyah.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;mednote&quot; style=&quot;margin-top:17px&quot;&gt;&lt;strong&gt;🛡️ Ingat:&lt;/strong&gt; Aktiviti ini membantu kamu belajar mengenali simptom, &lt;strong&gt;bukan menentukan penyakit seseorang&lt;/strong&gt;. Jika kamu berasa tidak sihat, beritahu orang dewasa yang dipercayai dan dapatkan nasihat kesihatan.&lt;/div&gt;

&lt;header&gt;&lt;h1&gt;🩺 Klinik Misteri: Detektif Simptom&lt;/h1&gt;&lt;div&gt;Permainan pengukuhan • SP 6.1.1&lt;/div&gt;&lt;p&gt;Kenali simptom demam campak, rubella, cacar air dan beguk.&lt;/p&gt;&lt;/header&gt;
&lt;section class=&quot;panel&quot; id=&quot;intro&quot;&gt;&lt;h2&gt;🎮 Jom uji pengetahuan!&lt;/h2&gt;&lt;p&gt;Padankan simptom dengan penyakit, kemudian selesaikan kes misteri. Kumpul markah dan lihat keputusan anda di akhir permainan.&lt;/p&gt;&lt;label&gt;Nama (pilihan)&lt;br&gt;&lt;input id=&quot;nama&quot; placeholder=&quot;Nama murid&quot; style=&quot;padding:10px;border:1px solid #c9dcec;border-radius:9px;margin-top:6px;width:100%&quot;&gt;&lt;/label&gt;&lt;br&gt;&lt;button class=&quot;action&quot; onclick=&quot;start()&quot;&gt;Mula bermain 🚀&lt;/button&gt;&lt;/section&gt;
&lt;section class=&quot;panel hidden&quot; id=&quot;match&quot;&gt;&lt;h2&gt;🧩 Padankan Simptom&lt;/h2&gt;&lt;p&gt;Pilih satu kad simptom, kemudian pilih nama penyakit yang sepadan. Lengkapkan semua padanan.&lt;/p&gt;&lt;div class=&quot;progress&quot;&gt;&lt;div class=&quot;bar&quot; id=&quot;p1&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;counter&quot;&gt;0/8 padanan tepat&lt;/p&gt;&lt;h3&gt;Kad simptom&lt;/h3&gt;&lt;div class=&quot;grid&quot; id=&quot;symptoms&quot;&gt;&lt;/div&gt;&lt;h3&gt;Pilih penyakit&lt;/h3&gt;&lt;div class=&quot;grid&quot; id=&quot;diseases&quot;&gt;&lt;/div&gt;&lt;div class=&quot;feedback&quot; id=&quot;f1&quot;&gt;Pilih kad simptom untuk bermula.&lt;/div&gt;&lt;button class=&quot;action&quot; id=&quot;next&quot; disabled onclick=&quot;toCases()&quot;&gt;Teruskan ke Cabaran Kes 🔐&lt;/button&gt;&lt;/section&gt;
&lt;section class=&quot;panel hidden&quot; id=&quot;cases&quot;&gt;&lt;h2&gt;🔐 Cabaran Kes Misteri&lt;/h2&gt;&lt;p&gt;Baca petunjuk dengan teliti dan pilih jawapan paling sesuai.&lt;/p&gt;&lt;div class=&quot;progress&quot;&gt;&lt;div class=&quot;bar&quot; id=&quot;p2&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;casecount&quot;&gt;&lt;/p&gt;&lt;div id=&quot;scenario&quot; class=&quot;feedback&quot;&gt;&lt;/div&gt;&lt;div id=&quot;options&quot;&gt;&lt;/div&gt;&lt;div id=&quot;f2&quot; class=&quot;feedback&quot;&gt;Pilih jawapan anda.&lt;/div&gt;&lt;button class=&quot;action hidden&quot; id=&quot;nextcase&quot; onclick=&quot;nextCase()&quot;&gt;Cabaran seterusnya ➡️&lt;/button&gt;&lt;/section&gt;
&lt;section class=&quot;panel hidden&quot; id=&quot;result&quot;&gt;&lt;h2&gt;🏆 Keputusan Permainan&lt;/h2&gt;&lt;h3 id=&quot;score&quot;&gt;&lt;/h3&gt;&lt;p id=&quot;message&quot;&gt;&lt;/p&gt;&lt;button class=&quot;action&quot; onclick=&quot;window.print()&quot;&gt;Cetak keputusan&lt;/button&gt;&lt;button class=&quot;action&quot; onclick=&quot;location.reload()&quot;&gt;Main semula&lt;/button&gt;&lt;/section&gt;
&lt;footer&gt;Aktiviti pendidikan sahaja, bukan alat diagnosis. Simptom boleh bertindih; dapatkan nasihat petugas kesihatan jika tidak sihat.&lt;/footer&gt;&lt;/main&gt;
&lt;script&gt;
const diseases=[&#x27;Demam campak&#x27;,&#x27;Rubella&#x27;,&#x27;Cacar air&#x27;,&#x27;Beguk&#x27;];

[&#x27;👁️💧&#x27;,&#x27;Mata merah bersama demam dan ruam&#x27;,0,&#x27;Mata merah boleh menjadi salah satu simptom demam campak.&#x27;],

[&#x27;🫧&#x27;,&#x27;Lepuh berisi cecair yang terasa gatal&#x27;,2,&#x27;Lepuh gatal berisi cecair ialah petunjuk utama cacar air.&#x27;],
[&#x27;🔴🟤&#x27;,&#x27;Bintik, lepuh dan keruping muncul pada kulit&#x27;,2,&#x27;Ruam cacar air boleh berada pada peringkat yang berbeza, termasuk lepuh dan keruping.&#x27;],

const cases=[

[&#x27;Kes 2: Seorang murid demam tinggi, batuk, hidung berair dan mata merah. Kemudian ruam bermula di muka.&#x27;,[&#x27;Demam campak&#x27;,&#x27;Beguk&#x27;,&#x27;Cacar air&#x27;,&#x27;Rubella&#x27;],0,&#x27;Gabungan demam, batuk, selesema, mata merah dan ruam mencadangkan demam campak.&#x27;],

[&#x27;Cabaran 5: Pilih DUA simptom yang paling berkaitan dengan cacar air.&#x27;,[&#x27;Lepuh berisi cecair&#x27;,&#x27;Kelenjar air liur bengkak&#x27;,&#x27;Ruam gatal&#x27;,&#x27;Mata merah&#x27;],[0,2],&#x27;Cacar air sering menyebabkan ruam gatal dan lepuh berisi cecair.&#x27;],
[&#x27;Cabaran 6: Yang manakah BUKAN petunjuk utama beguk?&#x27;,[&#x27;Bengkak pada rahang&#x27;,&#x27;Sakit ketika mengunyah&#x27;,&#x27;Lepuh gatal berisi cecair&#x27;,&#x27;Bengkak kelenjar air liur&#x27;],2,&#x27;Lepuh gatal berisi cecair lebih berkaitan dengan cacar air.&#x27;]];
let selectedCard=null,matched=new Set(),points=0,ci=0,firstTry=true,picks=new Set();
const $=id=&gt;document.getElementById(id);function show(id){[&#x27;intro&#x27;,&#x27;match&#x27;,&#x27;cases&#x27;,&#x27;result&#x27;].forEach(x=&gt;$(x).classList.toggle(&#x27;hidden&#x27;,x!==id))}
function start(){show(&#x27;match&#x27;);drawMatch()}
function drawMatch(){$(&#x27;symptoms&#x27;).innerHTML=symptoms.map((s,i)=&gt;`&lt;button class=&quot;card ${matched.has(i)?&#x27;done&#x27;:&#x27;&#x27;} ${selectedCard===i?&#x27;selected&#x27;:&#x27;&#x27;}&quot; ${matched.has(i)?&#x27;disabled&#x27;:&#x27;&#x27;} onclick=&quot;pickCard(${i})&quot;&gt;&lt;span class=&quot;emoji&quot;&gt;${s[0]}&lt;/span&gt;${s[1]}&lt;/button&gt;`).join(&#x27;&#x27;);$(&#x27;diseases&#x27;).innerHTML=diseases.map((d,i)=&gt;`&lt;button class=&quot;card&quot; onclick=&quot;matchDisease(${i})&quot;&gt;${[&#x27;🌡️&#x27;,&#x27;🌸&#x27;,&#x27;🫧&#x27;,&#x27;😷&#x27;][i]} &lt;b&gt;${d}&lt;/b&gt;&lt;/button&gt;`).join(&#x27;&#x27;);$(&#x27;counter&#x27;).textContent=`${matched.size}/8 padanan tepat`;$(&#x27;p1&#x27;).style.width=(matched.size/8*100)+&#x27;%&#x27;;$(&#x27;next&#x27;).disabled=matched.size!==8}

function matchDisease(i){if(selectedCard===null){$(&#x27;f1&#x27;).textContent=&#x27;Pilih kad simptom dahulu.&#x27;;return}let s=symptoms[selectedCard];if(s[2]===i){matched.add(selectedCard);points+=5;$(&#x27;f1&#x27;).textContent=&#x27;✅ Betul! &#x27;+s[3];selectedCard=null}else{$(&#x27;f1&#x27;).textContent=&#x27;Belum tepat. Cuba perhatikan petunjuk simptom sekali lagi.&#x27;}drawMatch();if(matched.size===8)$(&#x27;f1&#x27;).textContent=&#x27;🎉 Semua padanan selesai! Anda boleh ke Cabaran Kes.&#x27;}

function drawCase(){let c=cases[ci];firstTry=true;picks.clear();$(&#x27;casecount&#x27;).textContent=`Cabaran ${ci+1} daripada ${cases.length}`;$(&#x27;p2&#x27;).style.width=(ci/cases.length*100)+&#x27;%&#x27;;$(&#x27;scenario&#x27;).innerHTML=&#x27;&lt;b&gt;&#x27;+c[0]+&#x27;&lt;/b&gt;&lt;p class=&quot;small&quot;&gt;&#x27;+(Array.isArray(c[2])?&#x27;Pilih tepat dua jawapan.&#x27;:&#x27;Pilih satu jawapan.&#x27;)+&#x27;&lt;/p&gt;&#x27;;$(&#x27;options&#x27;).innerHTML=c[1].map((x,i)=&gt;`&lt;button class=&quot;choice&quot; id=&quot;o${i}&quot; onclick=&quot;choose(${i})&quot;&gt;${String.fromCharCode(65+i)}. ${x}&lt;/button&gt;`).join(&#x27;&#x27;);$(&#x27;f2&#x27;).textContent=&#x27;Pilih jawapan anda.&#x27;;$(&#x27;nextcase&#x27;).classList.add(&#x27;hidden&#x27;)}
function choose(i){let c=cases[ci],multi=Array.isArray(c[2]);if(multi){if(picks.has(i))picks.delete(i);else if(picks.size&lt;2)picks.add(i);for(let j=0;j&lt;4;j++)$(&#x27;o&#x27;+j).classList.toggle(&#x27;selected&#x27;,picks.has(j));if(picks.size&lt;2){$(&#x27;f2&#x27;).textContent=`${picks.size}/2 jawapan dipilih.`;return}finish(c[2].every(x=&gt;picks.has(x))&amp;&amp;picks.size===2)}else finish(i===c[2])}
